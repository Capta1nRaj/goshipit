name: Release & Publish

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version changed
        id: version
        run: |
          PREV=$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "0.0.0")
          CURR=$(node -p "require('./package.json').version")
          echo "curr=$CURR" >> $GITHUB_OUTPUT
          if [ "$PREV" = "$CURR" ]; then
            echo "No version change ($CURR). Skipping release."
            exit 0
          fi
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Delete existing tag and release if present
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURR=v${{ steps.version.outputs.curr }}
          # Delete GitHub release if exists (delete only if exists, else skip) — handles 404 JSON
          RAW=$(gh api repos/${{ github.repository }}/releases/tags/${CURR} 2>&1 || true)
          RELEASE_ID=$(echo "$RAW" | jq -r '.id // empty' 2>/dev/null || echo "")
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ] && echo "$RELEASE_ID" | grep -qE '^[0-9]+$'; then
            echo "Deleting release ${CURR} (id: ${RELEASE_ID})"
            gh api -X DELETE "repos/${{ github.repository }}/releases/${RELEASE_ID}"
          else
            echo "No existing release ${CURR} — skipping delete"
          fi
          # Delete remote tag if exists
          if git ls-remote --tags origin | grep -q "refs/tags/${CURR}$"; then
            echo "Deleting remote tag ${CURR}"
            git push origin --delete ${CURR}
          fi
          # Delete local tag if exists
          if git tag -l | grep -q "^${CURR}$"; then
            git tag -d ${CURR}
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag version
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.version.outputs.curr }}
          git push origin v${{ steps.version.outputs.curr }}

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.curr }}
          generate_release_notes: true
